<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programación Laboral · Jardines del Renacer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --ink:#233238;
    --ink-soft:#4d5c60;
    --paper:#F6F4EF;
    --paper-card:#FFFFFF;
    --line:#E1DDD3;
    --sage:#5F7F72;
    --sage-bg:#E7EEE9;
    --amber:#B98A3C;
    --amber-bg:#F5EBD8;
    --burgundy:#8C4550;
    --burgundy-bg:#F3E4E5;
    --slate:#7C8A8D;
    --slate-bg:#EBEEEC;
    --radius:10px;
    --shadow: 0 1px 2px rgba(35,50,56,0.06), 0 4px 14px rgba(35,50,56,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Source Serif 4',serif;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:40px 36px;
    width:100%;
    max-width:360px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .login-mark{
    width:44px;height:44px;border-radius:50%;
    background:var(--ink);
    margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
    color:var(--paper);
    font-family:'Source Serif 4',serif;
    font-size:20px;
  }
  .login-card h1{font-size:22px;margin:0 0 4px;font-weight:600;}
  .login-card p{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px;}
  #pin-input{
    width:100%;
    text-align:center;
    letter-spacing:10px;
    font-size:24px;
    padding:14px 10px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
    margin-bottom:14px;
  }
  #pin-input:focus{border-color:var(--sage);}
  .btn-primary{
    width:100%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:10px;
    padding:13px;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:.2px;
  }
  .btn-primary:hover{background:#16211f;}
  #login-error{color:var(--burgundy);font-size:13px;margin-top:12px;min-height:16px;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;}
  header.topbar{
    background:var(--paper-card);
    border-bottom:1px solid var(--line);
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;top:0;z-index:10;
  }
  .topbar-id{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:36px;height:36px;border-radius:50%;
    background:var(--sage-bg);color:var(--sage);
    display:flex;align-items:center;justify-content:center;
    font-family:'Source Serif 4',serif;font-weight:600;
  }
  .topbar-id .name{font-weight:600;font-size:14.5px;line-height:1.2;}
  .topbar-id .role{font-size:12px;color:var(--ink-soft);}
  #logout-btn{
    background:none;border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:12.5px;color:var(--ink-soft);
  }
  #logout-btn:hover{border-color:var(--slate);}

  nav.tabs{
    display:flex;gap:4px;padding:10px 16px 0;background:var(--paper-card);
    border-bottom:1px solid var(--line);overflow-x:auto;
  }
  nav.tabs button{
    background:none;border:none;padding:10px 14px;font-size:13.5px;
    font-weight:500;color:var(--ink-soft);border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--sage);font-weight:600;}

  main{padding:20px;max-width:760px;margin:0 auto;}

  .alert-banner{
    background:var(--burgundy-bg);
    color:var(--burgundy);
    border:1px solid #dfc3c6;
    border-radius:10px;
    padding:12px 16px;
    font-size:13.5px;
    margin-bottom:18px;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .alert-banner strong{display:block;font-size:13.5px;margin-bottom:2px;}

  .section-title{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:14px;
  }
  .section-title h2{font-size:19px;margin:0;font-weight:600;}
  .section-title .sub{font-size:12.5px;color:var(--ink-soft);}

  /* ---------- TASK CARD ---------- */
  .task-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-left:4px solid var(--slate);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    gap:14px;
    align-items:center;
    box-shadow:var(--shadow);
  }
  .task-card.tipo-Trabajo{border-left-color:var(--sage);}
  .task-card.tipo-Reunión{border-left-color:#7A6BA6;}
  .task-card.tipo-Correo{border-left-color:var(--amber);}
  .task-card.tipo-Almuerzo{border-left-color:var(--slate);}
  .task-card.tipo-Fuera\ de\ oficina{border-left-color:var(--burgundy);}

  .task-time{
    font-size:12px;color:var(--ink-soft);min-width:76px;font-variant-numeric:tabular-nums;
  }
  .task-body{flex:1;min-width:0;}
  .task-body .act{font-size:14.5px;font-weight:600;margin-bottom:3px;}
  .task-meta{display:flex;gap:6px;flex-wrap:wrap;}
  .badge{
    font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;
    text-transform:uppercase;letter-spacing:.3px;
  }
  .badge.pri-Alto{background:var(--burgundy-bg);color:var(--burgundy);}
  .badge.pri-Medio{background:var(--amber-bg);color:var(--amber);}
  .badge.pri-Bajo{background:var(--slate-bg);color:var(--slate);}

  .status-btn{
    border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;
    white-space:nowrap;
  }
  .status-btn.st-Sin-iniciar{background:var(--slate-bg);color:var(--slate);}
  .status-btn.st-En-curso{background:var(--amber-bg);color:var(--amber);}
  .status-btn.st-Completado{background:var(--sage-bg);color:var(--sage);}
  .status-btn.st-Pendiente{background:var(--burgundy-bg);color:var(--burgundy);}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--ink-soft);
  }
  .empty-state .mark{font-size:30px;margin-bottom:8px;}

  /* ---------- WEEK VIEW ---------- */
  .day-group{margin-bottom:22px;}
  .day-group h3{font-size:14px;margin:0 0 10px;color:var(--ink-soft);font-weight:600;text-transform:capitalize;}

  /* ---------- DASHBOARD ---------- */
  .team-card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:10px;
    padding:16px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .team-card .row1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .team-card .row1 .n{font-weight:600;font-size:14.5px;}
  .team-card .row1 .c{font-size:12px;color:var(--ink-soft);}
  .team-card .pct{font-family:'Source Serif 4',serif;font-size:20px;font-weight:600;color:var(--sage);}
  .bar-track{background:var(--line);border-radius:20px;height:7px;overflow:hidden;margin-bottom:8px;}
  .bar-fill{background:var(--sage);height:100%;border-radius:20px;}
  .team-stats{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);}

  /* ---------- FORM ---------- */
  form.new-task{
    background:var(--paper-card);border:1px solid var(--line);border-radius:12px;
    padding:20px;box-shadow:var(--shadow);
  }
  .form-row{margin-bottom:14px;}
  .form-row label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .form-row input, .form-row select, .form-row textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;
    background:var(--paper);font-size:14px;color:var(--ink);outline:none;
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus{border-color:var(--sage);}
  .form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  #task-msg{font-size:13px;margin-top:10px;min-height:16px;}
  #task-msg.ok{color:var(--sage);}
  #task-msg.err{color:var(--burgundy);}

  @media (max-width:480px){
    .task-card{flex-wrap:wrap;}
    .status-btn{width:100%;}
  }

  /* ---------- ICON ACTIONS ---------- */
  .icon-actions{display:flex;gap:4px;}
  .icon-btn{
    background:none;border:1px solid var(--line);border-radius:7px;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--ink-soft);
  }
  .icon-btn:hover{border-color:var(--slate);color:var(--ink);}
  .icon-btn.danger:hover{border-color:var(--burgundy);color:var(--burgundy);}

  /* ---------- EXPORT BAR ---------- */
  .export-bar{display:flex;gap:8px;}
  .btn-ghost{
    background:var(--paper-card);border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  }
  .btn-ghost:hover{border-color:var(--sage);color:var(--sage);}

  /* ---------- ADMIN ---------- */
  .admin-card{
    background:var(--paper-card);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
  }
  .admin-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .admin-card .top .n{font-weight:600;font-size:14.5px;}
  .admin-card .top .c{font-size:12px;color:var(--ink-soft);}
  .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .admin-grid label{font-size:11px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:4px;}
  .admin-grid input, .admin-grid select{
    width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;
    font-size:13px;background:var(--paper);color:var(--ink);
  }
  .admin-actions{display:flex;gap:8px;}
  .badge-inactivo{background:var(--slate-bg);color:var(--slate);font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;}
  .btn-small{
    border:none;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:600;
  }
  .btn-small.save{background:var(--sage-bg);color:var(--sage);}
  .btn-small.toggle{background:var(--amber-bg);color:var(--amber);}
  #admin-add-form{margin-top:18px;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-mark">JR</div>
    <h1>Programación Laboral</h1>
    <p>Ingresa tu código PIN para continuar</p>
    <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
    <button class="btn-primary" id="login-btn">Ingresar</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <header class="topbar">
    <div class="topbar-id">
      <div class="avatar" id="avatar-initial">–</div>
      <div>
        <div class="name" id="user-name">—</div>
        <div class="role" id="user-role">—</div>
      </div>
    </div>
    <button id="logout-btn">Salir</button>
  </header>

  <nav class="tabs">
    <button data-tab="dia" class="active">Mi día</button>
    <button data-tab="semana">Mi semana</button>
    <button data-tab="equipo">Equipo</button>
    <button data-tab="nueva">Nueva tarea</button>
    <button data-tab="admin" id="admin-tab-btn" style="display:none;">Admin</button>
  </nav>

  <main>
    <div id="banner-slot"></div>

    <!-- MI DIA -->
    <section id="tab-dia">
      <div class="section-title">
        <h2>Mi día</h2>
        <span class="sub" id="today-label"></span>
      </div>
      <div id="dia-list"></div>
    </section>

    <!-- MI SEMANA -->
    <section id="tab-semana" style="display:none;">
      <div class="section-title">
        <h2>Mi semana</h2>
        <span class="sub" id="week-range"></span>
      </div>
      <div class="export-bar" style="margin-bottom:14px;">
        <button class="btn-ghost" id="export-semana-xlsx">⬇ Excel</button>
        <button class="btn-ghost" id="export-semana-pdf">⬇ PDF</button>
      </div>
      <div id="semana-list"></div>
    </section>

    <!-- EQUIPO -->
    <section id="tab-equipo" style="display:none;">
      <div class="section-title">
        <h2>Equipo</h2>
        <span class="sub">Cumplimiento semana actual</span>
      </div>
      <div class="export-bar" style="margin-bottom:14px;">
        <button class="btn-ghost" id="export-equipo-xlsx">⬇ Excel</button>
        <button class="btn-ghost" id="export-equipo-pdf">⬇ PDF</button>
      </div>
      <div id="equipo-list"></div>
    </section>

    <!-- ADMIN -->
    <section id="tab-admin" style="display:none;">
      <div class="section-title"><h2>Administrar equipo</h2></div>
      <div id="admin-list"></div>

      <form class="new-task" id="admin-add-form">
        <div class="section-title"><h3 style="font-size:15px;margin:0;">Agregar persona</h3></div>
        <div class="admin-grid">
          <div><label>Nombre</label><input type="text" id="a-nombre" required></div>
          <div><label>Cargo</label><input type="text" id="a-cargo" required></div>
          <div><label>PIN (4 dígitos)</label><input type="text" id="a-pin" maxlength="6" required></div>
          <div><label>Rol</label>
            <select id="a-rol"><option>Coordinador</option><option>Director</option></select>
          </div>
        </div>
        <button type="submit" class="btn-primary">Agregar</button>
        <div id="admin-msg"></div>
      </form>
    </section>

    <!-- NUEVA TAREA -->
    <section id="tab-nueva" style="display:none;">
      <div class="section-title"><h2 id="new-task-title">Nueva tarea</h2></div>
      <form class="new-task" id="new-task-form">
        <div class="form-row">
          <label>Actividad</label>
          <input type="text" id="f-actividad" required placeholder="Ej. Revisión de PQR">
        </div>
        <div class="form-row">
          <label>Fecha</label>
          <input type="date" id="f-fecha" required>
        </div>
        <div class="form-grid2">
          <div class="form-row">
            <label>Hora inicio</label>
            <input type="time" id="f-inicio" required>
          </div>
          <div class="form-row">
            <label>Hora fin</label>
            <input type="time" id="f-fin" required>
          </div>
        </div>
        <div class="form-grid2">
          <div class="form-row">
            <label>Tipo</label>
            <select id="f-tipo">
              <option>Trabajo</option>
              <option>Reunión</option>
              <option>Correo</option>
              <option>Almuerzo</option>
              <option>Fuera de oficina</option>
              <option>Otro</option>
            </select>
          </div>
          <div class="form-row">
            <label>Prioridad</label>
            <select id="f-prioridad">
              <option>Medio</option>
              <option>Alto</option>
              <option>Bajo</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>Notas (opcional)</label>
          <textarea id="f-notas" rows="2"></textarea>
        </div>
        <button type="submit" class="btn-primary" id="new-task-submit">Guardar tarea</button>
        <div id="task-msg"></div>
      </form>
    </section>
  </main>
</div>

<script>
/* =========================================================
   CONFIGURA ESTA URL con la de tu implementación de Apps Script
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyCMuNSKGALIPPqSwiwR7pHfcV5QKLtpMt9Ind3JiwxbBekkYB_0t--SoL8xz-ilG9RBw/exec';

let currentUser = null;
let cachedTareas = [];
let cachedTareasAll = [];

const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

// ---------- FECHAS ----------
function pad(n){return String(n).padStart(2,'0');}
function toISO(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function startOfWeek(d){
  const day = d.getDay(); // 0=domingo
  const diff = (day === 0 ? -6 : 1) - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  return monday;
}
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

// ---------- API ----------
async function api(action, params={}){
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.keys(params).forEach(k => params[k] != null && url.searchParams.set(k, params[k]));
  const res = await fetch(url);
  return res.json();
}
async function apiPost(action, body={}){
  const res = await fetch(API_URL, {
    method:'POST',
    body: JSON.stringify({action, ...body})
  });
  return res.json();
}

// ---------- LOGIN ----------
$('#login-btn').addEventListener('click', doLogin);
$('#pin-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const pin = $('#pin-input').value.trim();
  if(!pin){ return; }
  $('#login-error').textContent = '';
  try{
    const r = await api('login', {pin});
    if(!r.ok){
      $('#login-error').textContent = r.error || 'PIN incorrecto';
      return;
    }
    currentUser = r.usuario;
    sessionStorage.setItem('jr_user', JSON.stringify(currentUser));
    enterApp();
  }catch(err){
    $('#login-error').textContent = 'No se pudo conectar. Verifica la URL del API.';
  }
}

$('#logout-btn').addEventListener('click', () => {
  currentUser = null;
  sessionStorage.removeItem('jr_user');
  $('#app').style.display='none';
  $('#login-screen').style.display='flex';
  $('#pin-input').value='';
});

function enterApp(){
  $('#login-screen').style.display='none';
  $('#app').style.display='block';
  $('#user-name').textContent = currentUser.nombre;
  $('#user-role').textContent = currentUser.cargo;
  $('#avatar-initial').textContent = currentUser.nombre.charAt(0).toUpperCase();
  if(currentUser.rol === 'Director'){
    $('#admin-tab-btn').style.display = 'inline-block';
  }
  loadDia();
}

// ---------- TABS ----------
$$('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', () => {
    $$('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['dia','semana','equipo','nueva','admin'].forEach(t=>{
      $('#tab-'+t).style.display = (t===btn.dataset.tab) ? 'block' : 'none';
    });
    if(btn.dataset.tab==='dia') loadDia();
    if(btn.dataset.tab==='semana') loadSemana();
    if(btn.dataset.tab==='equipo') loadEquipo();
    if(btn.dataset.tab==='admin') loadAdmin();
    if(btn.dataset.tab==='nueva') resetTaskForm();
  });
});

function resetTaskForm(){
  editingTaskId = null;
  editingReload = null;
  $('#new-task-form').reset();
  $('#f-fecha').value = toISO(new Date());
  $('#new-task-submit').textContent = 'Guardar tarea';
  $('#new-task-title').textContent = 'Nueva tarea';
  $('#task-msg').textContent = '';
}

// ---------- BANNER DE VENCIDAS ----------
function renderBanner(tareas){
  const now = new Date();
  const hhmm = pad(now.getHours())+':'+pad(now.getMinutes());
  const today = toISO(now);
  const vencidas = tareas.filter(t =>
    t.usuarioId == currentUser.id &&
    t.fecha === today &&
    t.horaFin < hhmm &&
    t.estado !== 'Completado'
  );
  const slot = $('#banner-slot');
  if(vencidas.length === 0){ slot.innerHTML=''; return; }
  slot.innerHTML = `<div class="alert-banner">⚠️
    <div><strong>${vencidas.length} tarea(s) vencida(s) sin completar hoy</strong>
    ${vencidas.map(t=>t.actividad).join(', ')}</div>
  </div>`;
}

// ---------- MI DIA ----------
async function loadDia(){
  const today = toISO(new Date());
  $('#today-label').textContent = DIAS[new Date().getDay()] + ', ' + today;
  const tareas = await api('getTareas', {usuarioId: currentUser.id, desde: today, hasta: today});
  cachedTareas = tareas;
  cachedTareasAll = mergeCache_(cachedTareasAll, tareas);
  renderBanner(tareas);
  const list = $('#dia-list');
  if(tareas.length === 0){
    list.innerHTML = emptyState('Sin tareas programadas para hoy');
    return;
  }
  tareas.sort((a,b)=> a.horaInicio.localeCompare(b.horaInicio));
  list.innerHTML = tareas.map(taskCard).join('');
  bindStatusButtons(list, loadDia);
}

function emptyState(msg){
  return `<div class="empty-state"><div class="mark">✓</div>${msg}</div>`;
}

function taskCard(t){
  const nextEstado = {
    'Sin iniciar':'En curso', 'En curso':'Completado', 'Completado':'Pendiente', 'Pendiente':'Sin iniciar'
  }[t.estado] || 'Sin iniciar';
  const tipoClass = 'tipo-' + t.tipo.replace(' ', '\\ ');
  const soyDueño = String(t.usuarioId) === String(currentUser.id);
  return `
  <div class="task-card ${tipoClass}">
    <div class="task-time">${t.horaInicio}<br>${t.horaFin}</div>
    <div class="task-body">
      <div class="act">${escapeHtml(t.actividad)}</div>
      <div class="task-meta">
        <span class="badge pri-${t.prioridad}">${t.prioridad}</span>
        <span class="badge" style="background:var(--slate-bg);color:var(--slate);">${t.tipo}</span>
      </div>
    </div>
    ${soyDueño ? `
    <div class="icon-actions">
      <button class="icon-btn edit-btn" data-id="${t.id}" title="Editar">✎</button>
      <button class="icon-btn danger delete-btn" data-id="${t.id}" title="Eliminar">🗑</button>
    </div>` : ''}
    <button class="status-btn st-${t.estado.replace(' ','-')}" data-id="${t.id}" data-next="${nextEstado}" ${soyDueño ? '' : 'disabled'}>${t.estado}</button>
  </div>`;
}

function bindStatusButtons(container, reload){
  container.querySelectorAll('.status-btn').forEach(btn=>{
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      const next = btn.dataset.next;
      btn.disabled = true;
      await apiPost('actualizarEstado', {id, estado: next});
      reload();
    });
  });
  container.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', () => openEditTask(btn.dataset.id, reload));
  });
  container.querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click', async () => {
      if(!confirm('¿Eliminar esta tarea?')) return;
      await apiPost('eliminarTarea', {id: btn.dataset.id});
      reload();
    });
  });
}

// ---------- EDITAR TAREA ----------
let editingTaskId = null;
let editingReload = null;

function openEditTask(id, reloadFn){
  const t = cachedTareasAll.find(x => String(x.id) === String(id));
  if(!t) return;
  editingTaskId = id;
  editingReload = reloadFn;
  $('#f-actividad').value = t.actividad;
  $('#f-fecha').value = t.fecha;
  $('#f-inicio').value = t.horaInicio;
  $('#f-fin').value = t.horaFin;
  $('#f-tipo').value = t.tipo;
  $('#f-prioridad').value = t.prioridad;
  $('#f-notas').value = t.notas || '';
  $('#new-task-submit').textContent = 'Guardar cambios';
  $('#new-task-title').textContent = 'Editar tarea';
  $$('nav.tabs button').forEach(b=>b.classList.remove('active'));
  $('nav.tabs button[data-tab="nueva"]').classList.add('active');
  ['dia','semana','equipo','nueva','admin'].forEach(t=>{
    $('#tab-'+t).style.display = (t==='nueva') ? 'block' : 'none';
  });
}

function mergeCache_(all, nuevas){
  const map = {};
  all.forEach(t => map[t.id] = t);
  nuevas.forEach(t => map[t.id] = t);
  return Object.values(map);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---------- MI SEMANA ----------
async function loadSemana(){
  const monday = startOfWeek(new Date());
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  $('#week-range').textContent = `${toISO(monday)} — ${toISO(sunday)}`;
  const tareas = await api('getTareas', {usuarioId: currentUser.id, desde: toISO(monday), hasta: toISO(sunday)});
  cachedTareasAll = mergeCache_(cachedTareasAll, tareas);

  const byDay = {};
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    byDay[toISO(d)] = [];
  }
  tareas.forEach(t => { if(byDay[t.fecha]) byDay[t.fecha].push(t); });

  const list = $('#semana-list');
  list.innerHTML = Object.keys(byDay).map(fecha=>{
    const dow = DIAS[new Date(fecha+'T00:00:00').getDay()];
    const items = byDay[fecha].sort((a,b)=>a.horaInicio.localeCompare(b.horaInicio));
    return `<div class="day-group">
      <h3>${dow} · ${fecha}</h3>
      ${items.length ? items.map(taskCard).join('') : emptyState('Sin tareas')}
    </div>`;
  }).join('');
  bindStatusButtons(list, loadSemana);
}

// ---------- EQUIPO ----------
async function loadEquipo(){
  const monday = startOfWeek(new Date());
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const data = await api('getDashboard', {desde: toISO(monday), hasta: toISO(sunday)});
  const list = $('#equipo-list');
  if(data.length === 0){ list.innerHTML = emptyState('Sin datos de equipo aún'); return; }
  list.innerHTML = data.map(u => `
    <div class="team-card">
      <div class="row1">
        <div>
          <div class="n">${escapeHtml(u.nombre)}</div>
          <div class="c">${escapeHtml(u.cargo)}</div>
        </div>
        <div class="pct">${u.porcentaje}%</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${u.porcentaje}%"></div></div>
      <div class="team-stats">
        <span>${u.completadas} completadas</span>
        <span>${u.enCurso} en curso</span>
        <span>${u.pendientes} pendientes</span>
        <span>${u.sinIniciar} sin iniciar</span>
      </div>
    </div>
  `).join('');
}

// ---------- NUEVA TAREA ----------
$('#f-fecha').value = toISO(new Date());

$('#new-task-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('#task-msg');
  msg.textContent = 'Guardando...'; msg.className='';
  const body = {
    usuarioId: currentUser.id,
    fecha: $('#f-fecha').value,
    horaInicio: $('#f-inicio').value,
    horaFin: $('#f-fin').value,
    actividad: $('#f-actividad').value,
    tipo: $('#f-tipo').value,
    prioridad: $('#f-prioridad').value,
    estado: 'Sin iniciar',
    notas: $('#f-notas').value
  };
  try{
    let r;
    if(editingTaskId){
      body.id = editingTaskId;
      r = await apiPost('actualizarTarea', body);
    }else{
      r = await apiPost('crearTarea', body);
    }
    if(r.ok){
      msg.textContent = editingTaskId ? 'Tarea actualizada.' : 'Tarea guardada.';
      msg.className='ok';
      const reload = editingReload;
      resetTaskForm();
      if(reload) reload();
    }else{
      msg.textContent = r.error || 'Error al guardar'; msg.className='err';
    }
  }catch(err){
    msg.textContent = 'No se pudo conectar con el servidor.'; msg.className='err';
  }
});

// ---------- ADMIN: GESTIÓN DE EQUIPO ----------
async function loadAdmin(){
  const usuarios = await api('getUsuariosAdmin');
  const list = $('#admin-list');
  if(usuarios.length === 0){ list.innerHTML = emptyState('Sin usuarios registrados'); return; }
  list.innerHTML = usuarios.map(u => `
    <div class="admin-card" data-id="${u.id}">
      <div class="top">
        <div><span class="n">${escapeHtml(u.nombre)}</span> ${!u.activo ? '<span class="badge-inactivo">Inactivo</span>' : ''}</div>
      </div>
      <div class="admin-grid">
        <div><label>Nombre</label><input type="text" class="a-nombre" value="${escapeHtml(u.nombre)}"></div>
        <div><label>Cargo</label><input type="text" class="a-cargo" value="${escapeHtml(u.cargo)}"></div>
        <div><label>PIN</label><input type="text" class="a-pin" value="${escapeHtml(String(u.pin))}"></div>
        <div><label>Rol</label>
          <select class="a-rol">
            <option ${u.rol==='Coordinador'?'selected':''}>Coordinador</option>
            <option ${u.rol==='Director'?'selected':''}>Director</option>
          </select>
        </div>
      </div>
      <div class="admin-actions">
        <button class="btn-small save" data-action="save">Guardar</button>
        <button class="btn-small toggle" data-action="toggle">${u.activo ? 'Desactivar' : 'Activar'}</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.admin-card').forEach(card => {
    const id = card.dataset.id;
    card.querySelector('[data-action="save"]').addEventListener('click', async () => {
      const body = {
        id,
        nombre: card.querySelector('.a-nombre').value,
        cargo: card.querySelector('.a-cargo').value,
        pin: card.querySelector('.a-pin').value,
        rol: card.querySelector('.a-rol').value,
        activo: !card.querySelector('.badge-inactivo')
      };
      await apiPost('actualizarUsuario', body);
      loadAdmin();
    });
    card.querySelector('[data-action="toggle"]').addEventListener('click', async () => {
      const estaActivo = !card.querySelector('.badge-inactivo');
      if(estaActivo){
        await apiPost('eliminarUsuario', {id});
      }else{
        const body = {
          id,
          nombre: card.querySelector('.a-nombre').value,
          cargo: card.querySelector('.a-cargo').value,
          pin: card.querySelector('.a-pin').value,
          rol: card.querySelector('.a-rol').value,
          activo: true
        };
        await apiPost('actualizarUsuario', body);
      }
      loadAdmin();
    });
  });
}

$('#admin-add-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('#admin-msg');
  msg.textContent = 'Guardando...'; msg.className='';
  const body = {
    nombre: $('#a-nombre').value,
    cargo: $('#a-cargo').value,
    pin: $('#a-pin').value,
    rol: $('#a-rol').value
  };
  const r = await apiPost('crearUsuario', body);
  if(r.ok){
    msg.textContent = 'Persona agregada.'; msg.className='ok';
    $('#admin-add-form').reset();
    loadAdmin();
  }else{
    msg.textContent = r.error || 'Error al guardar'; msg.className='err';
  }
});

// ---------- EXPORTACIÓN ----------
function exportExcel(rows, filename, headerMap){
  const data = rows.map(r => {
    const obj = {};
    Object.keys(headerMap).forEach(k => obj[headerMap[k]] = r[k]);
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Reporte');
  XLSX.writeFile(wb, filename);
}

function exportPDF(titulo, columnas, filas, filename){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text(titulo, 14, 16);
  doc.setFontSize(9);
  doc.text(new Date().toLocaleDateString('es-CO'), 14, 22);
  doc.autoTable({ startY: 28, head: [columnas], body: filas, styles: { fontSize: 8 }, headStyles: { fillColor: [35,50,56] } });
  doc.save(filename);
}

$('#export-semana-xlsx').addEventListener('click', () => {
  const headerMap = {fecha:'Fecha', horaInicio:'Inicio', horaFin:'Fin', actividad:'Actividad', tipo:'Tipo', prioridad:'Prioridad', estado:'Estado', notas:'Notas'};
  const tareas = Object.values(cachedTareasAll).filter(t => String(t.usuarioId) === String(currentUser.id));
  exportExcel(tareas, `mi_semana_${currentUser.nombre.replace(/\s/g,'_')}.xlsx`, headerMap);
});

$('#export-semana-pdf').addEventListener('click', () => {
  const tareas = Object.values(cachedTareasAll).filter(t => String(t.usuarioId) === String(currentUser.id));
  const filas = tareas.map(t => [t.fecha, t.horaInicio, t.horaFin, t.actividad, t.tipo, t.prioridad, t.estado]);
  exportPDF(`Mi semana — ${currentUser.nombre}`, ['Fecha','Inicio','Fin','Actividad','Tipo','Prioridad','Estado'], filas, `mi_semana_${currentUser.nombre.replace(/\s/g,'_')}.pdf`);
});

$('#export-equipo-xlsx').addEventListener('click', async () => {
  const monday = startOfWeek(new Date());
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const data = await api('getDashboard', {desde: toISO(monday), hasta: toISO(sunday)});

  exportExcel(data, `equipo_semana_${toISO(monday)}.xlsx`, headerMap);

$('#export-equipo-pdf').addEventListener('click', async () => {
  const monday = startOfWeek(new Date());
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const data = await api('getDashboard', {desde: toISO(monday), hasta: toISO(sunday)});
